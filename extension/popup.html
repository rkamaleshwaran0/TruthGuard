<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TruthGuard</title>
  <style>
    :root {
      --bg-base: #090d16;
      --bg-card: rgba(20, 27, 45, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      --brand: #6366f1;

      --color-reliable: #10b981;
      --color-reliable-bg: rgba(16, 185, 129, 0.15);

      --color-warning: #f59e0b;
      --color-warning-bg: rgba(245, 158, 11, 0.15);

      --color-fake: #ef4444;
      --color-fake-bg: rgba(239, 68, 68, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      background: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: white;
      stroke-width: 2.2;
    }

    .brand-name {
      font-weight: 800;
      font-size: 15px;
      background: linear-gradient(90deg, #ffffff, #c7d2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--color-reliable);
      box-shadow: 0 0 6px var(--color-reliable);
    }

    .btn-quick {
      width: 100%;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #c7d2fe;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
      transition: background 0.2s;
    }

    .btn-quick:hover {
      background: rgba(99, 102, 241, 0.3);
    }

    textarea {
      width: 100%;
      background: rgba(14, 20, 32, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-main);
      padding: 8px 10px;
      font-size: 12px;
      min-height: 60px;
      margin-bottom: 8px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: var(--brand);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Result Card */
    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px;
      display: none;
    }

    .triage-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .badge-reliable {
      background: var(--color-reliable-bg);
      color: var(--color-reliable);
      border: 1px solid var(--color-reliable);
    }

    .badge-warning {
      background: var(--color-warning-bg);
      color: var(--color-warning);
      border: 1px solid var(--color-warning);
    }

    .badge-fake {
      background: var(--color-fake-bg);
      color: var(--color-fake);
      border: 1px solid var(--color-fake);
    }

    .risk-bar-container {
      margin: 8px 0;
    }

    .risk-bar {
      height: 6px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 4px;
      overflow: hidden;
    }

    .risk-fill {
      height: 100%;
      transition: width 0.4s ease;
    }

    .reasons-list {
      list-style: none;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .reasons-list li {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.3;
      padding-left: 8px;
      border-left: 2px solid var(--brand);
    }

    .matched-box {
      margin-top: 8px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      font-size: 11px;
    }

    .footer-note {
      text-align: center;
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="brand-name">TruthGuard</div>
    </div>
    <div style="display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--color-reliable);">
      <span class="status-dot"></span>
      <span>Engine Active</span>
    </div>
  </div>

  <button class="btn-quick" id="btnInspectPage">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    Inspect Active Tab / Selection
  </button>

  <textarea id="popupInputText" placeholder="Or paste claim in English, Tamil, or Hindi..."></textarea>
  <button class="btn-primary" id="btnPopupAnalyze">Verify Claim</button>

  <div class="result-card" id="popupResult">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span class="triage-badge" id="popupBadge">Needs Verification</span>
      <span style="font-size: 12px; font-weight: 700;" id="popupRiskNum">Risk: 50/100</span>
    </div>

    <div class="risk-bar-container">
      <div class="risk-bar">
        <div class="risk-fill" id="popupRiskFill" style="width: 50%;"></div>
      </div>
    </div>

    <div id="popupMatchedBox" class="matched-box" style="display: none;">
      <div style="font-weight: 700; color: #a5b4fc; margin-bottom: 2px;">Fact Check Match:</div>
      <div id="popupMatchedText" style="font-style: italic;"></div>
    </div>

    <ul class="reasons-list" id="popupReasons"></ul>
  </div>

  <div class="footer-note">Strict Evidence-First Misinformation Triage</div>

  <script src="popup.js"></script>
</body>
</html>
